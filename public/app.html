<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fcfcfd">
    <title>Archive</title>
    <link rel="icon" type="image/svg+xml" href="/assets/ediary.svg">
    <link rel="preload" href="/assets/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link rel="preload" href="/assets/fonts/remixicon.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <link href="/assets/fancybox.css" rel="stylesheet">
    <link href="/app.css?v=4.1" rel="stylesheet">
    <!-- Preload the whole ES module graph so a high-latency link pays one round
         trip instead of a discovery waterfall. URLs (incl. ?v=) must match the
         import specifiers exactly, or the browser fetches modules twice. -->
    <link rel="modulepreload" href="/modules/app.js?v=4.3">
    <link rel="modulepreload" href="/modules/dom.js">
    <link rel="modulepreload" href="/modules/api.js">
    <link rel="modulepreload" href="/modules/ui.js">
    <link rel="modulepreload" href="/modules/swal.js">
    <link rel="modulepreload" href="/modules/auth.js">
    <link rel="modulepreload" href="/modules/editor.js">
    <link rel="modulepreload" href="/modules/upload.js">
    <script src="/assets/htmx.js" defer></script>
    <script src="/assets/sweetalert2.all.min.js" defer></script>
    <style>
        body {
            opacity: 0;
        }

        body.ready {
            opacity: 1;
            transition: opacity 0.15s;
        }
    </style>
</head>

<body>

    <!-- Auth Overlay -->
    <div id="auth-overlay">
        <div class="auth-card">
            <div class="c-title">ENTER PASSWORD</div>
            <form id="auth-form" hx-post="/api/login" hx-target="#auth-messages" hx-swap="innerHTML">
                <input type="password" name="password" id="auth-input" required placeholder="" autofocus>
                <button type="submit" class="auth-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M16.172 11l-5.364-5.364 1.414-1.414L20 12l-7.778 7.778-1.414-1.414L16.172 13H4v-2z">
                        </path>
                    </svg>
                </button>
            </form>
            <div id="auth-messages"></div>
        </div>
    </div>



    <!-- Main Container -->
    <div class="d-container">

        <!-- Editor Card (new entry) -->
        <div class="card" id="editor-card"></div>

        <!-- Editor DOM (moved into card or list row at runtime) -->
        <div id="editor-wrapper-dom" class="editor-wrapper" style="display:none">
            <div class="toolbar" id="toolbar">
                <button class="tb-btn" data-cmd="bold"><i class="ri-bold"></i></button>
                <button class="tb-btn" data-cmd="italic"><i class="ri-italic"></i></button>
                <button class="tb-btn" data-cmd="justifyCenter" id="btn-center"><i class="ri-align-center"></i></button>
                <button class="tb-btn" data-cmd="indentClass" id="btn-indent"><i class="ri-indent-increase"></i></button>
                <button class="tb-btn" data-cmd="justifyFull" id="btn-justify"><i class="ri-align-justify"></i></button>
                <button class="tb-btn" data-cmd="formatBlock" data-val="H1">H1</button>
                <button class="tb-btn" data-cmd="formatBlock" data-val="H2">H2</button>
                <button class="tb-btn" data-cmd="formatBlock" data-val="blockquote"><i class="ri-double-quotes-l"></i></button>
                <button class="tb-btn" data-cmd="insertOrderedList" id="btn-ol">
                    <svg viewBox="0 0 24 24" style="width:1.15em;height:1.15em;fill:currentColor">
                        <path d="M2 17h2v.5H3v1h1v.5H2v1h3v-4H2v1zm1-9h1V4H2v1h1v3zm-1 3h1.8L2 13.1v.9h3v-1H3.2L5 10.9V10H2v1zm5-6v2h14V5H7zm0 14h14v-2H7v2zm0-6h14v-2H7v2z"/>
                    </svg>
                </button>
                <button class="tb-btn" data-cmd="insertUnorderedList" id="btn-ul">
                    <svg viewBox="0 0 24 24" style="width:1.15em;height:1.15em;fill:currentColor">
                        <path d="M8 4h13v2H8V4zm0 6h13v2H8v-2zm0 6h13v2H8v-2zM3 5a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm0 6a1 1 0 1 1 2 0 1 1 0 0 1-2 0zm0 6a1 1 0 1 1 2 0 1 1 0 0 1-2 0z"/>
                    </svg>
                </button>
                <button class="tb-btn" data-cmd="insertChecklist" id="btn-checklist">
                    <svg viewBox="0 0 24 24" style="width:1.15em;height:1.15em;fill:currentColor">
                        <path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm1 2v14h14V5H5zm5.3 7.7l-2.8-2.8-1.4 1.4 4.2 4.2 6.4-6.4-1.4-1.4-5 5z"/>
                    </svg>
                </button>
                <div class="tb-more-wrapper">
                    <button class="tb-btn tb-more-trigger">
                        <svg viewBox="0 0 24 24" style="width:1.15em;height:1.15em;fill:currentColor">
                            <path d="M5 12a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm9 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm9 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"/>
                        </svg>
                    </button>
                    <div class="tb-more-panel">
                        <div class="tb-more-panel-inner">
                            <div class="color-picker-wrapper">
                                <button class="tb-btn" id="btn-color"><i class="ri-palette-line"></i></button>
                                <div class="color-dropdown" id="color-dropdown">
                                    <div class="color-options">
                                        <div class="color-option" style="background:#000000" data-color="#000000"></div>
                                        <div class="color-option" style="background:#ef4444" data-color="#ef4444"></div>
                                        <div class="color-option" style="background:#f59e0b" data-color="#f59e0b"></div>
                                        <div class="color-option" style="background:#22c55e" data-color="#22c55e"></div>
                                        <div class="color-option" style="background:#3b82f6" data-color="#3b82f6"></div>
                                        <div class="color-option" style="background:#a855f7" data-color="#a855f7"></div>
                                    </div>
                                </div>
                            </div>
                            <button class="tb-btn" id="btn-hr"><i class="ri-separator"></i></button>
                            <button class="tb-btn" id="btn-img"><i class="ri-image-add-line"></i></button>
                            <button class="tb-btn" id="btn-vid">
                                <svg viewBox="0 0 24 24" style="width:1.2em; height:1.2em; fill:currentColor">
                                    <path d="M2 3.993A1 1 0 0 1 2.992 3h18.016c.548 0 .992.445.992.993v16.014a1 1 0 0 1-.992.993H2.992A.993.993 0 0 1 2 20.007V3.993zM8 5v14h8V5H8zM4 5v2h2V5H4zm14 0v2h2V5h-2zM4 13v2h2V9h-2zM4 13v2h2v-2H4zm14 0v2h2v-2h-2zM4 17v2h2v-2H4zm14 0v2h2v-2h-2z" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <input type="file" id="img-input" name="file" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none">
                <input type="file" id="vid-input" name="file" accept="video/mp4,video/webm,video/quicktime" style="display:none">
                <div class="editor-actions">
                    <div class="date-wrapper note-date-editor">
                        <span class="date-pill" id="date-label">
                            <i class="ri-calendar-line"></i>
                            <span id="date-text">...</span>
                        </span>
                        <input type="date" class="inp-date" id="d-date" required>
                    </div>
                    <button id="d-save" class="btn-save-mini">
                        <i class="ri-send-plane-fill"></i><span id="save-txt">PUBLISH</span>
                    </button>
                    <button class="btn-close-editor" onclick="App.closeEditor()">
                        <i class="ri-close-line"></i>
                    </button>
                </div>
            </div>
            
            <div id="d-text" class="editor-box" contenteditable="true" spellcheck="false"></div>
            
            <div id="img-toolbar" class="img-toolbar">
                <button class="it-btn" data-w="25">25%</button>
                <button class="it-btn" data-w="50">50%</button>
                <button class="it-btn" data-w="75">75%</button>
                <button class="it-btn" data-w="100">100%</button>
            </div>
        </div>

        <!-- Archive Card -->
        <div class="card main-card" style="min-height: 400px;">
            <div class="c-head">
                <span class="c-title" id="c-title-box">ARCHIVE</span>
                <div class="head-right">
                    <div id="sync-stat" class="sync-stat"></div>
                    <button class="btn-new-mini" onclick="App.newEntry()">
                        <svg class="ri-icon" viewBox="0 0 24 24">
                            <path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2h6z" />
                        </svg>
                        NEW
                    </button>
                </div>
            </div>
            <div id="v-index" class="view-container active">
                <div id="year-grid" class="year-grid" hx-get="/api/stats" hx-trigger="load, refresh-stats from:body">
                </div>
            </div>
            <div id="v-backup" class="view-container">
                <div class="nav-header">
                    <div class="btn-back" onclick="App.goBack()"><svg class="ri-icon" style="stroke-width:0"
                            viewBox="0 0 24 24">
                            <path
                                d="M7.828 11H20v2H7.828l5.364 5.364-1.414 1.414L4 12l7.778-7.778 1.414 1.414L7.828 11z" />
                        </svg></div>
                </div>
                <div style="padding: 10px 20px; text-align: center;">
                    <i class="ri-database-2-line"
                        style="font-size:64px;color:var(--m-blu);opacity:0.2;margin-bottom:30px;display:inline-block;"></i>
                    <div
                        style="display:flex;justify-content:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center;">
                        <div class="date-wrapper" style="margin-left:0">
                            <span class="date-pill" onclick="this.nextElementSibling.showPicker?.()">
                                <i class="ri-calendar-line"></i>
                                <span id="export-from-text">FROM</span>
                            </span>
                            <input type="date" class="inp-date" id="export-from"
                                onchange="document.getElementById('export-from-text').innerText=this.value||'FROM'">
                        </div>
                        <span style="color:var(--txt-mut);font-weight:600;">&ndash;</span>
                        <div class="date-wrapper" style="margin-left:0">
                            <span class="date-pill" onclick="this.nextElementSibling.showPicker?.()">
                                <i class="ri-calendar-line"></i>
                                <span id="export-to-text">TO</span>
                            </span>
                            <input type="date" class="inp-date" id="export-to"
                                onchange="document.getElementById('export-to-text').innerText=this.value||'TO'">
                        </div>
                    </div>
                    <div>
                        <button id="btn-export" class="btn-backup primary" onclick="App.downloadBackup()">
                            DOWNLOAD
                        </button>
                        <button id="btn-restore" onclick="App.pickRestoreFile()" class="btn-backup secondary"
                            type="button">
                            RESTORE
                        </button>
                        <input type="file" id="restore-input" accept=".json,application/json" style="display:none">
                        <div id="restore-msg" style="margin-top:10px;height:20px;"></div>
                    </div>
                </div>
            </div>

            <div id="v-list" class="view-container">
                <div class="nav-header">
                    <div class="btn-back" id="btn-back" onclick="App.goBack()"><svg class="ri-icon" style="stroke-width:0" viewBox="0 0 24 24"><path d="M7.828 11H20v2H7.828l5.364 5.364-1.414 1.414L4 12l7.778-7.778 1.414 1.414L7.828 11z" /></svg></div>
                    <div id="month-filter" class="month-filter" hx-get="/api/months"
                        hx-trigger="load, refresh-months from:body"></div>
                </div>
                <div id="entry-list" hx-get="/api/list" hx-trigger="load, refresh-list from:body"></div>
                <div id="pg-box" class="pg-box" style="display:none"></div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer
        style="text-align:center;padding:7px;color:var(--txt-mut);font-size:12px;opacity:0.6;margin-top:auto;width:100%;">
        &copy; <span id="footer-year"></span> <a href="https://github.com/kazelink/ediary" target="_blank"
            style="color:inherit;text-decoration:none;">ediary</a>.
    </footer>

    <script type="module" src="/modules/app.js?v=4.3"></script>
</body>

</html>
